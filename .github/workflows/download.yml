name: Kubespray offline files - single ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check free disk space
        run: df -h .
      - name: Download all files and create one ZIP
        run: python3 scripts/download_and_pack.py
      - name: Upload one ZIP as one Artifact
        uses: actions/upload-artifact@v7
        with:
          name: kubespray-offline-files-amd64
          path: output/kubespray-offline-files-amd64.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
